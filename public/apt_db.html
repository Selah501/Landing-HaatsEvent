<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아파트 DB - 하츠 충남대리점</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        .sidebar { width: 280px; background: white; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; overflow-y: auto; }
        .search-container { padding: 16px; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; background: white; }
        .search-container input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        
        .add-btn { background: #0ea5e9; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; margin-top: 10px; cursor: pointer; font-weight: bold; }
        .add-btn:hover { background: #0284c7; }
        
        .nav-item { padding: 12px 16px; cursor: pointer; color: #374151; font-size: 14px; border-bottom: 1px solid #f3f4f6; border-left: 3px solid transparent; }
        .nav-item:hover { background: #f9fafb; }
        .nav-item.active { background: #f0f9ff; border-left-color: #0ea5e9; color: #0369a1; font-weight: 600; }
        
        .content-area { flex: 1; padding: 30px; overflow-y: auto; background: #fff; }
        
        .form-section { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .form-section h3 { margin-top: 0; margin-bottom: 16px; font-size: 16px; color: #111827; border-bottom: 1px solid #f3f4f6; padding-bottom: 10px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 12px; }
        .form-group.full { grid-column: span 2; }
        .form-group label { font-size: 13px; font-weight: 600; color: #4b5563; margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea { padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14,165,233,0.1); }
        .form-group textarea { resize: vertical; min-height: 80px; }
        
        .checkbox-group { display: flex; gap: 16px; align-items: center; }
        .checkbox-group label { display: flex; align-items: center; gap: 6px; font-weight: normal; margin-bottom: 0; }
        
        .btn-row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-primary { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-danger { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-ai { background: #8b5cf6; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #6b7280; }
    
        /* 교체 품목 테이블 스타일 */
        .replacement-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        .replacement-table th, .replacement-table td { border: 1px solid #e5e7eb; padding: 8px; text-align: center; }
        .replacement-table th { background: #f9fafb; font-weight: 600; color: #374151; }
        .replacement-table input, .replacement-table select { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #d1d5db; border-radius: 4px; }
        .replacement-table .img-preview { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
        .replacement-table .img-preview img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid #d1d5db; }
        .replacement-table .btn-sm { padding: 4px 8px; font-size: 12px; border-radius: 4px; cursor: pointer; border: none; }
        .btn-upload { background: #3b82f6; color: white; }
        .btn-del-row { background: #ef4444; color: white; }
        
        /* 모달 스타일 */
        #img-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center; }
        #img-modal img { max-width: 90%; max-height: 90%; border-radius: 8px; }
        #img-modal .close-btn { position: absolute; top: 20px; right: 20px; font-size: 30px; color: white; cursor: pointer; }

    </style>
</head>
<body>

    <div id="unified-header"></div>

    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="search-container">
                <input type="text" id="search-apt" placeholder="아파트 검색...">
                <div style="display:flex; gap:8px; margin-top:10px;">
                    <button class="add-btn" style="margin-top:0; flex:1;" onclick="createNew()">+ 새 아파트</button>
                    <button class="add-btn" style="margin-top:0; flex:1; background:#8b5cf6;" onclick="fetchFromEvents()">+ 기존 현장 불러오기</button>
                </div>
            </div>
            <div id="apt-list">
                <div style="padding: 20px; text-align: center; color: #6b7280;">로딩 중...</div>
            </div>
        </div>
        
        <!-- Content Area -->
        <div class="content-area">
            <div id="empty-state" class="empty-state">
                <h2>아파트를 선택하거나 새로 등록하세요</h2>
            </div>
            
            <div id="form-container" style="display: none; max-width: 900px; margin: 0 auto;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 id="form-title" style="margin:0;">아파트 정보</h2>
                    <button class="btn-ai" onclick="runAIAnalysis()">✨ AI 사전 분석 (이력 기반)</button>
                </div>
                
                <form id="apt-form">
                    <input type="hidden" id="f_id">
                    
                    <div class="form-section">
                        <h3>기본 정보</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label>아파트명 (아파트명 지역명)</label>
                                <input type="text" id="f_apt_name" placeholder="예: 효성해링턴 내포" required>
                            </div>
                            <div class="form-group">
                                <label>아파트 특성</label>
                                <select id="f_apt_type">
                                    <option value="">선택</option>
                                    <option value="일반">일반</option>
                                    <option value="임대">임대</option>
                                    <option value="임대+일반 혼합">임대+일반 혼합</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>세대수</label>
                                <input type="text" id="f_total_units" placeholder="예: 1024세대">
                            </div>
                            <div class="form-group">
                                <label>준공년도</label>
                                <input type="text" id="f_build_year" placeholder="예: 2021년">
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>영업 현황 (마케팅)</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label>전단지 영업기간</label>
                                <input type="text" id="f_campaign_period" placeholder="예: 26.7.26~8.2">
                            </div>
                            <div class="form-group">
                                <label>전단지 게시 지정요일</label>
                                <input type="text" id="f_post_day" placeholder="예: 매주 월요일">
                            </div>
                            <div class="form-group">
                                <label>시공세대수</label>
                                <input type="text" id="f_sales_count" placeholder="예: 15세대">
                            </div>
                            <div class="form-group">
                                <label>매출총액</label>
                                <input type="text" id="f_sales_revenue" placeholder="예: 3,500,000원">
                            </div>
                            <div class="form-group">
                                <label>마진총액</label>
                                <input type="text" id="f_sales_margin" placeholder="예: 1,500,000원">
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>현장 스펙 (시공 특기사항)</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label>주방 후드 규격</label>
                                <input type="text" id="f_spec_hood" placeholder="예: 하츠 테라(가로 900)">
                            </div>
                            <div class="form-group">
                                <label>주방 레인지 환경</label>
                                <select id="f_spec_range">
                                    <option value="">선택</option>
                                    <option value="가스레인지">가스레인지</option>
                                    <option value="인덕션">인덕션</option>
                                    <option value="혼합(동-타입별 상이)">혼합(동-타입별 상이)</option>
                                </select>
                            </div>
                            <div class="form-group full">
                                <label>추가 가전 유무</label>
                                <div class="checkbox-group">
                                    <label><input type="checkbox" id="f_has_oven"> 전기오븐 있음</label>
                                    <label><input type="checkbox" id="f_has_dishwasher"> 식기세척기 있음</label>
                                </div>
                            </div>
                            <div class="form-group full">
                                <label>욕실 스펙 및 간섭 여부</label>
                                <textarea id="f_spec_bathroom" placeholder="예: 안방은 기존 타공구멍이 큼. 아크릴 마감판(22만) 필수 안내 요망. 거실은 미니 19.5만 가능. 배관 간섭 없음."></textarea>
                            </div>
                        </div>
                    </div>

                    
                    <div class="form-section">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #f3f4f6; padding-bottom: 10px;">
                            <h3 style="margin: 0; border: none; padding: 0; display: flex; align-items: center;">교체 품목 및 자료 (문서/이미지) <button type="button" class="btn-sm" style="background:#f3f4f6; color:#374151; border:1px solid #d1d5db; margin-left:10px;" onclick="manageCategories()">⚙️ 구분 관리</button></h3>
                            <div>
                                <input type="text" id="search-replacement" placeholder="항목 검색..." style="padding: 6px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; margin-right: 8px;" oninput="renderReplacements()">
                                <select id="sort-replacement" style="padding: 6px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; margin-right: 8px;" onchange="renderReplacements()">
                                    <option value="none">정렬 안함</option>
                                    <option value="old_asc">교체전 제품 (오름차순)</option>
                                    <option value="cat_asc">구분 (오름차순)</option>
                                </select>
                                <button type="button" class="btn-primary btn-sm" onclick="addReplacementRow()" style="padding: 6px 12px; font-size: 13px;">+ 행 추가</button>
                            </div>
                        </div>
                        <div style="overflow-x: auto;">
                            <table class="replacement-table" id="replacement-table">
                                <thead>
                                    <tr>
                                        <th style="width: 15%;">교체전 제품</th>
                                        <th style="width: 15%;">교체제품</th>
                                        <th style="width: 12%;">구분</th>
                                        <th style="width: 15%;">특징</th>
                                        <th style="width: 25%;">이미지/문서 (최대 5장)</th>
                                        <th style="width: 13%;">특기사항</th>
                                        <th style="width: 5%;">관리</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Rows will be injected here -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>관리 정보 & 비고</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label>관리사무소 전화번호</label>
                                <input type="text" id="f_office_phone" placeholder="예: 041-123-4567">
                            </div>
                            <div class="form-group full">
                                <label>다음 영업 참조사항 (기타 메모)</label>
                                <textarea id="f_next_sales_notes" placeholder="다음 방문 시 사각 씽크볼 홍보 전단 집중 투입할 것"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="btn-row">
                        <button type="button" class="btn-danger" id="btn-delete" style="display:none;" onclick="deleteData()">삭제</button>
                        <button type="button" class="btn-primary" onclick="saveData()">💾 DB 저장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="./auth.js?v=2"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

        const firebaseConfig = {
            databaseURL: "https://flyer-event-page-2026-default-rtdb.firebaseio.com",
            projectId: "flyer-event-page-2026",
            storageBucket: "flyer-event-page-2026.firebasestorage.app"
        };
        const app = initializeApp(firebaseConfig);
        window.firebaseStorage = getStorage(app);
        window.sRef = sRef;
        window.uploadBytes = uploadBytes;
        window.getDownloadURL = getDownloadURL;

        import { getDatabase, ref as dbRef, get, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
        window.firebaseDb = getDatabase(app);
        window.dbRef = dbRef;
        window.dbGet = get;
        window.dbSet = set;

    </script>

    <script>
        const SUPABASE_URL = 'https://belchthacupzpgxevecx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_weMvIv-69PgtXwzGlgweLg_NEJfOACN';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let aptList = [];
        let currentId = null;

        
        let currentCategories = ['주방후드', '영업자료']; // 초기 기본값

        async function loadCategories() {
            if(!window.firebaseDb) {
                setTimeout(loadCategories, 200);
                return;
            }
            const r = window.dbRef(window.firebaseDb, 'system/apt_categories');
            try {
                const snapshot = await window.dbGet(r);
                if (snapshot.exists()) {
                    currentCategories = snapshot.val();
                }
                renderCategoryOptions();
            } catch (err) {
                console.error("Categories load failed:", err);
            }
        }

        function renderCategoryOptions() {
            let dl = document.getElementById('global-cat-list');
            if(!dl) {
                dl = document.createElement('datalist');
                dl.id = 'global-cat-list';
                document.body.appendChild(dl);
            }
            dl.innerHTML = currentCategories.map(c => `<option value="${c}">`).join('');
            
            // 기존 렌더링된 select나 input이 있으면 업데이트
            if (typeof renderReplacements === 'function') {
                renderReplacements();
            }
        }

        window.manageCategories = async () => {
            let html = `<div style="text-align:left; max-height:250px; overflow-y:auto; margin-bottom:10px;" id="cat-manage-list">`;
            currentCategories.forEach((cat, i) => {
                html += `<div style="display:flex; justify-content:space-between; margin-bottom:5px; padding:5px; border-bottom:1px solid #ddd;">
                    <span>${cat}</span>
                    <button class="btn-sm btn-del-row" onclick="window.removeCat(${i})">삭제</button>
                </div>`;
            });
            html += `</div>
            <div style="display:flex; gap:5px;">
                <input type="text" id="new-cat-input" class="swal2-input" placeholder="새 구분 입력" style="margin:0; flex:1;">
                <button class="btn-primary" style="padding:10px;" onclick="window.addCat()">추가</button>
            </div>`;

            await Swal.fire({
                title: '구분 목록 관리',
                html: html,
                showConfirmButton: true,
                confirmButtonText: '닫기'
            });
        }

        window.removeCat = async (idx) => {
            currentCategories.splice(idx, 1);
            if(window.firebaseDb) await window.dbSet(window.dbRef(window.firebaseDb, 'system/apt_categories'), currentCategories);
            renderCategoryOptions();
            manageCategories(); // 팝업 재렌더링
        }
        
        window.addCat = async () => {
            const val = document.getElementById('new-cat-input').value.trim();
            if(!val) return;
            if(currentCategories.includes(val)) {
                Swal.showValidationMessage('이미 존재하는 구분입니다.');
                return;
            }
            currentCategories.push(val);
            if(window.firebaseDb) await window.dbSet(window.dbRef(window.firebaseDb, 'system/apt_categories'), currentCategories);
            renderCategoryOptions();
            manageCategories();
        }
        
        // 페이지 로드 시 카테고리 로드
        document.addEventListener('DOMContentLoaded', () => {
            loadCategories(); 
        });

        let currentReplacements = []; // 현재 선택된 아파트의 교체품목 데이터 배열

        function renderReplacements() {
            const tbody = document.querySelector('#replacement-table tbody');
            tbody.innerHTML = '';
            
            const keyword = document.getElementById('search-replacement').value.toLowerCase();
            const sortMode = document.getElementById('sort-replacement').value;
            
            let filtered = currentReplacements.filter(item => {
                return (item.old_product || '').toLowerCase().includes(keyword) ||
                       (item.new_product || '').toLowerCase().includes(keyword) ||
                       (item.category || '').toLowerCase().includes(keyword) ||
                       (item.features || '').toLowerCase().includes(keyword) ||
                       (item.notes || '').toLowerCase().includes(keyword);
            });
            
            if (sortMode === 'old_asc') {
                filtered.sort((a, b) => (a.old_product || '').localeCompare(b.old_product || ''));
            } else if (sortMode === 'cat_asc') {
                filtered.sort((a, b) => (a.category || '').localeCompare(b.category || ''));
            }

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="color:#6b7280; padding: 20px;">등록된 품목이 없습니다.</td></tr>';
                return;
            }

            filtered.forEach((item) => {
                const idx = currentReplacements.indexOf(item);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="text" value="${item.old_product || ''}" onchange="updateReplacement(${idx}, 'old_product', this.value)"></td>
                    <td><input type="text" value="${item.new_product || ''}" onchange="updateReplacement(${idx}, 'new_product', this.value)"></td>
                    <td>
                        <input type="text" list="global-cat-list" value="${item.category || ''}" onchange="updateReplacement(${idx}, 'category', this.value)" style="width:100%;">
                        
                    </td>
                    <td><input type="text" value="${item.features || ''}" onchange="updateReplacement(${idx}, 'features', this.value)"></td>
                    <td>
                        <div style="display:flex; flex-direction:column; gap:4px; align-items:center;">
                            <button type="button" class="btn-sm btn-upload" onclick="uploadReplacementMedia(${idx})" ${item.mediaUrls && item.mediaUrls.length >= 5 ? 'disabled style="opacity:0.5;"' : ''}>첨부 (${item.mediaUrls ? item.mediaUrls.length : 0}/5)</button>
                            <div class="img-preview">
                                ${(item.mediaUrls || []).map((url, mIdx) => `
                                    <div style="position:relative; display:inline-block;">
                                        <img src="${url}" onclick="openImgModal('${url}')">
                                        <div onclick="removeReplacementMedia(${idx}, ${mIdx})" style="position:absolute; top:-5px; right:-5px; background:red; color:white; border-radius:50%; width:16px; height:16px; font-size:10px; cursor:pointer; display:flex; align-items:center; justify-content:center;">&times;</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </td>
                    <td><input type="text" value="${item.notes || ''}" onchange="updateReplacement(${idx}, 'notes', this.value)"></td>
                    <td><button type="button" class="btn-sm btn-del-row" onclick="deleteReplacementRow(${idx})">❌</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function addReplacementRow() {
            currentReplacements.push({
                old_product: '',
                new_product: '-',
                category: '',
                features: '',
                mediaUrls: [],
                notes: ''
            });
            renderReplacements();
        }

        function updateReplacement(idx, field, value) {
            if(currentReplacements[idx]) {
                currentReplacements[idx][field] = value;
            }
        }

        function deleteReplacementRow(idx) {
            if(confirm('해당 행을 삭제하시겠습니까?')) {
                currentReplacements.splice(idx, 1);
                renderReplacements();
            }
        }

        function openImgModal(url) {
            document.getElementById('img-modal-content').src = url;
            document.getElementById('img-modal').style.display = 'flex';
        }

        async function uploadReplacementMedia(idx) {
            if (!window.firebaseStorage || !window.uploadBytes) {
                Swal.fire('오류', '업로드 모듈 초기화 중입니다. 잠시 후 다시 시도해주세요.', 'warning');
                return;
            }
            
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*,application/pdf';
            fileInput.multiple = true;
            fileInput.onchange = async (e) => {
                const files = Array.from(e.target.files);
                if(files.length === 0) return;
                
                const item = currentReplacements[idx];
                const currentCount = item.mediaUrls ? item.mediaUrls.length : 0;
                if(currentCount + files.length > 5) {
                    Swal.fire('오류', '최대 5장까지만 업로드 가능합니다.', 'error');
                    return;
                }

                Swal.fire({ title: '업로드 중...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                
                try {
                    const uploaded = [];
                    for(const file of files) {
                        const filename = Date.now() + '_' + file.name;
                        const storageRef = window.sRef(window.firebaseStorage, 'apt_db/' + filename);
                        await window.uploadBytes(storageRef, file);
                        const url = await window.getDownloadURL(storageRef);
                        uploaded.push(url);
                    }
                    
                    if(!item.mediaUrls) item.mediaUrls = [];
                    item.mediaUrls = [...item.mediaUrls, ...uploaded];
                    renderReplacements();
                    Swal.close();
                } catch (err) {
                    console.error(err);
                    Swal.fire('오류', '파일 업로드 실패: ' + err.message, 'error');
                }
            };
            fileInput.click();
        }

        function removeReplacementMedia(rowIdx, mediaIdx) {
            if(confirm('이 이미지를 삭제하시겠습니까?')) {
                currentReplacements[rowIdx].mediaUrls.splice(mediaIdx, 1);
                renderReplacements();
            }
        }


        initAdminAuth(() => {
            document.getElementById('unified-header').innerHTML = renderUnifiedHeader('apt_db', '🏢 아파트 사전조사 DB');
            loadData();
        });

        async function loadData() {
            const { data, error } = await sb.from('apartment_specs').select('*').order('created_at', { ascending: false });
            if (error) {
                console.error("Supabase load error:", error);
                return;
            }
            aptList = data;
            renderList();
        }

        function renderList() {
            const container = document.getElementById('apt-list');
            container.innerHTML = '';
            
            const keyword = document.getElementById('search-apt').value.toLowerCase();
            const filtered = aptList.filter(a => (a.apt_name || '').toLowerCase().includes(keyword));

            if (filtered.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: #6b7280; font-size: 13px;">등록된 아파트가 없습니다.</div>';
                return;
            }

            filtered.forEach(apt => {
                const div = document.createElement('div');
                div.className = 'nav-item';
                if (currentId === apt.id) div.classList.add('active');
                div.textContent = apt.apt_name;
                div.onclick = () => selectApt(apt.id);
                container.appendChild(div);
            });
        }

        document.getElementById('search-apt').addEventListener('input', renderList);

        function selectApt(id) {
            currentId = id;
            renderList();
            
            const apt = aptList.find(a => a.id === id);
            if (!apt) return;

            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('form-container').style.display = 'block';
            document.getElementById('form-title').textContent = apt.apt_name;
            document.getElementById('btn-delete').style.display = 'block';

            // 폼 채우기
            document.getElementById('f_id').value = apt.id || '';
            document.getElementById('f_apt_name').value = apt.apt_name || '';
            document.getElementById('f_apt_type').value = apt.apt_type || '';
            document.getElementById('f_total_units').value = apt.total_units || '';
            document.getElementById('f_build_year').value = apt.build_year || '';
            document.getElementById('f_campaign_period').value = apt.campaign_period || '';
            document.getElementById('f_sales_count').value = apt.sales_count || '';
            document.getElementById('f_sales_revenue').value = apt.sales_revenue || '';
            document.getElementById('f_sales_margin').value = apt.sales_margin || '';
            document.getElementById('f_spec_hood').value = apt.spec_hood || '';
            document.getElementById('f_spec_range').value = apt.spec_range || '';
            document.getElementById('f_has_oven').checked = apt.has_oven || false;
            document.getElementById('f_has_dishwasher').checked = apt.has_dishwasher || false;
            document.getElementById('f_spec_bathroom').value = apt.spec_bathroom || '';
            document.getElementById('f_office_phone').value = apt.office_phone || '';
            document.getElementById('f_post_day').value = apt.post_day || '';
            document.getElementById('f_next_sales_notes').value = apt.next_sales_notes || '';
            currentReplacements = apt.replacement_items || [];
            renderReplacements();
        }

        function createNew() {
            currentId = null;
            renderList();
            
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('form-container').style.display = 'block';
            document.getElementById('form-title').textContent = "새 아파트 등록";
            document.getElementById('btn-delete').style.display = 'none';
            
            document.getElementById('apt-form').reset();
            document.getElementById('f_id').value = '';
        }

        async function fetchFromEvents() {
            try {
                Swal.fire({ title: '이벤트 목록 불러오는 중...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                const res = await fetch('https://flyer-event-page-2026-default-rtdb.firebaseio.com/events.json');
                const events = await res.json();
                if (!events || events.length === 0) {
                    Swal.fire('알림', '등록된 이벤트 현장이 없습니다.', 'info');
                    return;
                }
                
                // Get unique targetApt from events
                let eventNames = [];
                events.forEach(ev => {
                    const name = ev.targetApt || ev.title;
                    if (name && !eventNames.includes(name)) {
                        eventNames.push(name);
                    }
                });
                
                // Filter out already registered
                const registeredNames = aptList.map(a => a.apt_name);
                const missingNames = eventNames.filter(n => !registeredNames.includes(n));
                
                if (missingNames.length === 0) {
                    Swal.fire('알림', '모든 이벤트 현장이 이미 DB에 등록되어 있습니다.', 'info');
                    return;
                }
                
                // Create selection UI
                let optionsHtml = missingNames.map((name, idx) => 
                    `<button style="display:block; width:100%; padding:12px; margin-bottom:8px; border:1px solid #d1d5db; border-radius:6px; background:#fff; text-align:left; cursor:pointer; font-size:14px; color:#374151;" onclick="window.selectMissingEvent('${name.replace(/'/g, "\\'")}')">${name}</button>`
                ).join('');
                
                Swal.fire({
                    title: '등록되지 않은 기존 이벤트 현장',
                    html: `<div style="max-height:300px; overflow-y:auto; padding-top:10px;">${optionsHtml}</div>`,
                    showConfirmButton: false,
                    showCancelButton: true,
                    cancelButtonText: '닫기'
                });
                
                window.selectMissingEvent = function(name) {
                    Swal.close();
                    createNew();
                    document.getElementById('f_apt_name').value = name;
                };
            } catch (err) {
                console.error(err);
                Swal.fire('오류', '이벤트 데이터를 불러오는 중 실패했습니다.', 'error');
            }
        }

        async function saveData() {
            const name = document.getElementById('f_apt_name').value.trim();
            if (!name) {
                Swal.fire('오류', '아파트명을 입력해주세요.', 'error');
                return;
            }

            const payload = {
                apt_name: name,
                apt_type: document.getElementById('f_apt_type').value,
                total_units: document.getElementById('f_total_units').value,
                build_year: document.getElementById('f_build_year').value,
                campaign_period: document.getElementById('f_campaign_period').value,
                sales_count: document.getElementById('f_sales_count').value,
                sales_revenue: document.getElementById('f_sales_revenue').value,
                sales_margin: document.getElementById('f_sales_margin').value,
                spec_hood: document.getElementById('f_spec_hood').value,
                spec_range: document.getElementById('f_spec_range').value,
                has_oven: document.getElementById('f_has_oven').checked,
                has_dishwasher: document.getElementById('f_has_dishwasher').checked,
                spec_bathroom: document.getElementById('f_spec_bathroom').value,
                office_phone: document.getElementById('f_office_phone').value,
                post_day: document.getElementById('f_post_day').value,
                next_sales_notes: document.getElementById('f_next_sales_notes').value,
                replacement_items: currentReplacements
            };

            const id = document.getElementById('f_id').value;
            try {
                if (id) {
                    await sb.from('apartment_specs').update(payload).eq('id', id);
                    Swal.fire('저장 성공', '아파트 정보가 업데이트되었습니다.', 'success');
                } else {
                    const { data } = await sb.from('apartment_specs').insert([payload]).select();
                    if(data && data.length > 0) currentId = data[0].id;
                    Swal.fire('등록 성공', '새 아파트가 등록되었습니다.', 'success');
                }
                await loadData();
                if(currentId) selectApt(currentId);
            } catch (err) {
                Swal.fire('오류', '저장 중 문제가 발생했습니다.', 'error');
                console.error(err);
            }
        }

        async function deleteData() {
            const id = document.getElementById('f_id').value;
            if (!id) return;
            
            const result = await Swal.fire({
                title: '삭제하시겠습니까?',
                text: "이 작업은 되돌릴 수 없습니다.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: '삭제'
            });
            
            if (result.isConfirmed) {
                await sb.from('apartment_specs').delete().eq('id', id);
                currentId = null;
                document.getElementById('form-container').style.display = 'none';
                document.getElementById('empty-state').style.display = 'flex';
                await loadData();
                Swal.fire('삭제됨', '아파트 정보가 삭제되었습니다.', 'success');
            }
        }

        async function runAIAnalysis() {
            const aptName = document.getElementById('f_apt_name').value;
            if(!aptName) {
                Swal.fire('알림', '아파트명을 먼저 입력한 후 AI 분석을 실행하세요.', 'info');
                return;
            }
            Swal.fire({
                title: 'AI 분석 중...',
                text: `'${aptName}'의 기존 시공 이력을 불러오고 분석합니다.`,
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });
            
            try {
                // 1. Firebase RTDB에서 과거 이력 가져오기 (임시로 전체 reservations에서 이름이 포함된 것 필터)
                const dbRes = await fetch('https://flyer-event-page-2026-default-rtdb.firebaseio.com/reservations.json');
                const allData = await dbRes.json();
                
                let texts = [];
                let totalSales = 0;
                let totalMargin = 0;
                let totalCount = 0;
                let mediaUrls = [];

                if (allData) {
                    for(const date in allData) {
                        for(const time in allData[date]) {
                            const res = allData[date][time];
                            const apt = res.customerInfo?.apt || '';
                            // 표준 현장 명칭으로 완벽한 일치 검색 (과거 띄어쓰기 등 파편화된 데이터는 제외 또는 수동 정비 후 매칭)
                            if (apt.includes(aptName)) { 
                                const notes = res.report?.techNotes || '';
                                const salesNotes = res.report?.salesNotes || '';
                                const usedProducts = res.report?.usedProducts || [];
                                texts.push(`기술노트: ${notes}, 영업노트: ${salesNotes}, 사용제품: ${JSON.stringify(usedProducts)}`);
                                
                                const payAmount = parseInt(res.report?.payAmount || 0);
                                if (payAmount > 0) totalSales += payAmount;

                                const margin = parseInt(res.report?.actualMargin || res.report?.margin || 0);
                                if (margin > 0) totalMargin += margin;

                                totalCount += 1;

                                if (res.report?.mediaUrls) {
                                    mediaUrls = mediaUrls.concat(res.report.mediaUrls);
                                }
                            }
                        }
                    }
                }

                if (texts.length === 0) {
                    Swal.fire('알림', '해당 아파트와 관련된 과거 시공 이력을 찾지 못했습니다.', 'info');
                    return;
                }

                // 통계값 즉시 폼에 채우기
                document.getElementById('f_sales_count').value = totalCount + "세대";
                document.getElementById('f_sales_revenue').value = totalSales.toLocaleString() + "원";
                document.getElementById('f_sales_margin').value = totalMargin.toLocaleString() + "원";

                // 최근 10장의 사진만 AI 분석에 사용 (가장 최신 시공 사진 기준)
                mediaUrls = mediaUrls.slice(-10);

                // 2. Cloud Function 호출
                const analyzeCall = await fetch('https://us-central1-flyer-event-page-2026.cloudfunctions.net/analyzeApartmentSpec', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: { aptName: aptName, texts: texts, mediaUrls: mediaUrls } })
                });
                
                const result = await analyzeCall.json();
                if (result.error) throw new Error(result.error.message || 'API Error');
                
                const parsed = result.result;
                
                document.getElementById('f_spec_bathroom').value = parsed.spec_bathroom || '';
                document.getElementById('f_spec_hood').value = parsed.spec_hood || '';
                document.getElementById('f_next_sales_notes').value = parsed.next_sales_notes || '';
                
                Swal.fire('AI 분석 완료', '시공결과 데이터를 바탕으로 폼이 1차적으로 채워졌습니다. 내용을 꼼꼼히 확인하고 수정한 뒤 저장해주세요.', 'success');
            } catch (err) {
                console.error(err);
                Swal.fire('분석 실패', 'AI 분석 중 오류가 발생했습니다: ' + err.message, 'error');
            }
        }
    </script>
