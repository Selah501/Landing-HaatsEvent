<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하츠 충남대리점 공식 캠페인</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <style>
        /* Custom Styles for Checkboxes in Form */
        .checkbox-label {
            display: flex;
            align-items: center;
            color: var(--color-silver-mist);
            margin-bottom: 8px;
            font-size: 14px;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .checkbox-label:hover {
            background-color: rgba(255,255,255,0.05);
        }
        .checkbox-label input[type="checkbox"] {
            transform: scale(1.2);
            margin-right: 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="mobile-container">
        <nav class="sticky-nav">
            <div class="nav-logo"><span>[공식]</span>하츠 충남대리점</div>
            <a href="tel:010-2886-5086" class="btn btn-secondary">전화 문의</a>
        </nav>

        <header class="hero-section">
            <h1 class="hero-title">여름철 눅눅한 욕실,<br>언제까지 방치하시겠습니까?</h1>
            <p class="hero-subtitle">해당하시는 아파트 단지의 이벤트 현장을 선택해주세요.</p>
        </header>

        <main class="campaign-container" id="events-container">
            <!-- events.js 데이터를 기반으로 동적 렌더링 됩니다. -->
        </main>

        <footer class="footer-area">
            <div class="quick-links">
                <a href="./products/tioram-mini.html">티오람 미니 제품상세</a>
                <a href="./guide/work-and-payment.html">교체공정 및 결제안내</a>
            </div>
            <div class="brand-footer">캠페인 주관사: TBJ 홈케어 사업부</div>
        </footer>
    </div>

    <!-- Firebase SDK (모듈식) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://flyer-event-page-2026-default-rtdb.firebaseio.com",
            projectId: "flyer-event-page-2026"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Firebase에서 실시간 데이터 불러오기
        const dbRef = ref(db, '/');
        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                window.globalProducts = data.products || [];
                window.eventsData = data.events || [];
                if (typeof window.renderEvents === 'function') {
                    window.renderEvents();
                }
            } else {
                console.error("데이터베이스가 비어있습니다.");
            }
        });
    </script>
    <script>
        let currentEventName = "";
        const container = document.getElementById('events-container');

        // 상품 표시 텍스트 조립 함수
        function getProductText(prodObj) {
            const masterProd = typeof globalProducts !== 'undefined' ? globalProducts.find(p => p.id === prodObj.id) : null;
            const prodName = masterProd ? masterProd.name : "알 수 없는 상품";
            const priceText = prodObj.customText ? prodObj.customText : (masterProd ? masterProd.defaultPriceText : "");
            return priceText ? `${prodName} (${priceText})` : prodName;
        }

        // 이벤트 렌더링 로직
        window.renderEvents = function() {
            if (!window.eventsData || !window.globalProducts) return;
            let html = '';
            // 진행중 이벤트 렌더링
            eventsData.forEach(ev => {
                if (ev.status === 'active') {
                    
                    // 메인 상품 렌더링
                    let mainProductsHtml = '';
                    if (ev.mainProducts && ev.mainProducts.length > 0) {
                        mainProductsHtml += '<div style="margin-bottom: 24px;">';
                        mainProductsHtml += '<div style="font-size: 14px; color: var(--color-interactive-lime); font-weight: bold; margin-bottom: 12px;">이벤트 메인 상품</div>';
                        ev.mainProducts.forEach(prod => {
                            const mProd = globalProducts.find(p => p.id === prod.id);
                            if(!mProd) return;
                            const text = getProductText(prod);
                            
                            mainProductsHtml += `
                                <div style="background-color: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 16px; margin-bottom: 8px;">
                                    <div style="color: #fff; font-size: 16px; font-weight: bold; margin-bottom: 4px;">${text}</div>
                                    <div style="color: #aaa; font-size: 13px; margin-bottom: 12px;">${mProd.features || ''}</div>
                                    ${mProd.detailLink ? `<a href="${mProd.detailLink}" style="display: inline-block; color: var(--color-interactive-lime); text-decoration: none; font-size: 13px; font-weight: bold;">👉 자세히 보기</a>` : ''}
                                </div>
                            `;
                        });
                        mainProductsHtml += '</div>';
                    }

                    // 같이 바꾸면 좋은 상품 렌더링
                    let addonProductsHtml = '';
                    if (ev.addonProducts && ev.addonProducts.length > 0) {
                        addonProductsHtml += `
                            <div style="background: linear-gradient(135deg, #2a2a2d 0%, #1c1c1e 100%); border-radius: 12px; padding: 20px; border: 1px solid #444; margin-bottom: 24px;">
                                <div style="text-align: center; margin-bottom: 16px;">
                                    <span style="display: inline-block; background: var(--color-interactive-lime); color: var(--color-pitch-black); font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 20px; margin-bottom: 6px;">함께 신청하면 혜택 UP!</span>
                                    <h3 style="color: var(--color-pure-white); font-size: 16px; margin: 0;">같이 바꾸면 좋은 프리미엄 특가</h3>
                                </div>
                                <div style="display: flex; flex-direction: column; gap: 8px;">
                        `;
                        ev.addonProducts.forEach(prod => {
                            const mProd = globalProducts.find(p => p.id === prod.id);
                            if(!mProd) return;
                            const text = getProductText(prod);
                            
                            if(mProd.detailLink) {
                                addonProductsHtml += `
                                    <a href="${mProd.detailLink}" style="display: flex; justify-content: space-between; align-items: center; background-color: var(--color-graphite-base); padding: 14px; border-radius: 8px; text-decoration: none; border: 1px solid #555;">
                                        <div>
                                            <div style="color: var(--color-silver-mist); font-size: 12px; margin-bottom: 4px;">${mProd.features || '프리미엄 상품'}</div>
                                            <div style="color: #fff; font-size: 15px; font-weight: bold;">${text}</div>
                                        </div>
                                        <div style="color: var(--color-interactive-lime); font-size: 18px; font-weight: bold;">➔</div>
                                    </a>
                                `;
                            } else {
                                addonProductsHtml += `
                                    <div style="background-color: var(--color-graphite-base); padding: 14px; border-radius: 8px; border: 1px solid #555;">
                                        <div style="color: var(--color-silver-mist); font-size: 12px; margin-bottom: 4px;">${mProd.features || '프리미엄 상품'}</div>
                                        <div style="color: #fff; font-size: 15px; font-weight: bold;">${text}</div>
                                    </div>
                                `;
                            }
                        });
                        addonProductsHtml += `
                                </div>
                            </div>
                        `;
                    }

                    // 모든 선택 가능한 상품 (메인 + 부가)
                    const allProducts = [...(ev.mainProducts || []), ...(ev.addonProducts || [])];
                    let formProductsHtml = '';
                    allProducts.forEach((prod, idx) => {
                        const text = getProductText(prod);
                        const isFan = text.includes('환풍기') || text.includes('티오람') || text.includes('댐퍼') || text.includes('제로크');
                        let qtyHtml = '';
                        if(isFan) {
                            qtyHtml = `
                                <select name="qty-${ev.id}-${prod.id}" style="margin-left:auto; padding: 4px 8px; border-radius: 4px; border: 1px solid #555; background-color: #222; color: white; font-size: 14px;">
                                    <option value="1대">1대</option>
                                    <option value="2대">2대</option>
                                </select>
                            `;
                        }

                        formProductsHtml += `
                            <label class="checkbox-label" style="display: flex; align-items: center;">
                                <input type="checkbox" name="product-${ev.id}" value="${text}" data-id="${prod.id}">
                                <span>${text}</span>
                                ${qtyHtml}
                            </label>
                        `;
                    });

                    html += `
                    <div id="card-${ev.id}" class="campaign-card active-card" onclick="toggleCampaign('${ev.id}', '${ev.title}')">
                        <div style="display: flex; align-items: center; margin-bottom: 8px;">
                            <span class="badge-status" style="margin-bottom: 0; margin-right: 8px; background-color: #10b981; color: white;">진행중</span>
                            <div id="card-title-${ev.id}" class="card-title" style="margin-bottom: 0; transition: all 0.3s ease;">${ev.title}</div>
                        </div>
                        <div class="card-price">${ev.priceText}</div>
                        <div class="card-period">${ev.periodText}</div>
                        <div id="click-arrow-${ev.id}" class="click-arrow">▼ 클릭하여 신청하기</div>
                    </div>

                    <div id="content-${ev.id}" class="expanded-content">
                        
                        ${mainProductsHtml}
                        ${addonProductsHtml}

                        <button id="btn-show-form-${ev.id}" class="btn btn-primary" style="margin-bottom: 12px;" onclick="showForm('${ev.id}')">👉 무료 상담 예약하기</button>
                        <a href="./reservation.html?eventId=${ev.id}&v=2" class="btn btn-secondary" style="margin-bottom: 12px; display: block; text-align: center; background-color: #6366f1; border-color: #6366f1; color: white;">🛠️ 설치 예약 바로하기</a>

                        <div id="form-container-${ev.id}" style="display: none; background-color: var(--color-graphite-base); padding: 20px; border-radius: 8px; border: 1px solid #333;">
                            <div class="form-title">간편 상담 예약</div>
                            <div style="margin-bottom: 16px;">
                                <div style="color: var(--color-pure-white); font-size: 14px; margin-bottom: 8px;">상담 희망 상품 (다중 선택 가능)</div>
                                ${formProductsHtml}
                            </div>
                            <div class="input-group">
                                <input type="text" id="apt-${ev.id}" placeholder="[아파트 동/호수] 예: 101동 102호">
                                <input type="text" id="phone-${ev.id}" placeholder="[연락처] 010-0000-0000">
                                <input type="text" id="time-${ev.id}" placeholder="[원하는 상담시간] 예: 평일 오후 2시 이후">
                            </div>
                            <button id="btn-submit-${ev.id}" class="btn btn-primary" onclick="submitForm('${ev.id}')">신청서 제출하기</button>
                            <button class="btn btn-ghost" style="margin-top: 8px;" onclick="hideForm('${ev.id}')">입력 취소</button>
                        </div>
                        
                        <button class="btn btn-ghost" style="margin-top: 12px;" onclick="toggleCampaign('${ev.id}', '')">▲ 이벤트 접기 (목록으로)</button>
                    </div>`;
                }
            });

            // 종료된 이벤트 렌더링
            let endedHtml = '<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;">';
            eventsData.forEach(ev => {
                if (ev.status === 'ended') {
                    endedHtml += `
                    <div class="ended-card" style="flex: 1 1 calc(33.333% - 8px); min-width: 140px; opacity: 0.6; background-color: #222; border: 1px solid #444; padding: 10px; border-radius: 6px; cursor: default; text-align: center;">
                        <div style="font-size: 11px; color: #999; margin-bottom: 4px;"><span style="background:#555; color:#fff; padding:2px 4px; border-radius:3px; margin-right:4px;">종료</span></div>
                        <div style="font-size: 12px; color: #ccc; word-break: keep-all; line-height: 1.3;">
                            ${ev.title}<br>(${ev.periodText})
                        </div>
                    </div>`;
                }
            });
            endedHtml += '</div>';
            html += endedHtml;

            container.innerHTML = html;
        }

        // 초기 렌더링은 Firebase onValue 콜백에서 비동기로 실행됩니다.
        // renderEvents();
        // 폼 열기/닫기 로직
        function showForm(id) {
            document.getElementById(`form-container-${id}`).style.display = "block";
            document.getElementById(`btn-show-form-${id}`).style.display = "none";
        }
        function hideForm(id) {
            document.getElementById(`form-container-${id}`).style.display = "none";
            document.getElementById(`btn-show-form-${id}`).style.display = "flex";
        }

        // 박스 클릭 시 타 단지 숨기기 및 토글 로직
        function toggleCampaign(id, eventName) {
            currentEventName = eventName;
            const targetContent = document.getElementById(`content-${id}`);
            const targetCard = document.getElementById(`card-${id}`);

            // 모든 진행중 카드와 컨텐츠 가져오기
            const allCards = document.querySelectorAll('.active-card');
            const allContents = document.querySelectorAll('.expanded-content');

            const subtitle = document.querySelector('.hero-subtitle');
            
            if (targetContent.style.display === "block") {
                // 원상 복구 (현재 열려있는걸 닫을 때)
                targetContent.style.display = "none";
                targetCard.classList.remove('active');
                hideForm(id); // 접을 때 폼도 초기화
                // 다른 모든 카드 다시 보이기
                allCards.forEach(card => {
                    card.style.display = "flex";
                    // 스타일 복구
                    const cardId = card.id.replace('card-', '');
                    const arrow = document.getElementById(`click-arrow-${cardId}`);
                    if(arrow) arrow.style.display = "block";
                    const title = document.getElementById(`card-title-${cardId}`);
                    if(title) {
                        title.style.color = "";
                        title.style.transform = "scale(1)";
                    }
                });
                if(subtitle) subtitle.style.display = "block";
            } else {
                // 모두 숨기기
                allCards.forEach(card => {
                    card.style.display = "none";
                    // 스타일 복구 (다른 카드를 클릭했을 때를 대비)
                    const cardId = card.id.replace('card-', '');
                    const arrow = document.getElementById(`click-arrow-${cardId}`);
                    if(arrow) arrow.style.display = "block";
                    const title = document.getElementById(`card-title-${cardId}`);
                    if(title) {
                        title.style.color = "";
                        title.style.transform = "scale(1)";
                    }
                });
                allContents.forEach(content => content.style.display = "none");
                
                // 선택한 것만 열기
                targetCard.style.display = "flex";
                targetCard.classList.add('active');
                targetContent.style.display = "block";
                
                // 선택된 카드 스타일 변경 (화살표 숨김, 타이틀 강조)
                const currentArrow = document.getElementById(`click-arrow-${id}`);
                if(currentArrow) currentArrow.style.display = "none";
                const currentTitle = document.getElementById(`card-title-${id}`);
                if(currentTitle) {
                    currentTitle.style.color = "var(--color-interactive-lime)";
                    currentTitle.style.transform = "scale(1.03)";
                    currentTitle.style.transformOrigin = "left center";
                }

                if(subtitle) subtitle.style.display = "none";
            }
        }

        // 구글 시트 데이터 전송 함수
        function submitForm(id) {
            const apartment = document.getElementById(`apt-${id}`).value;
            let phone = document.getElementById(`phone-${id}`).value;
            const consultTime = document.getElementById(`time-${id}`).value;

            // 전화번호 하이픈 자동 추가 처리
            phone = phone.replace(/[^0-9]/g, ''); // 숫자만 추출
            if (phone.length === 11) {
                phone = phone.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
            } else if (phone.length === 10) {
                phone = phone.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
            }

            if (!apartment || !phone) {
                alert("동/호수와 연락처를 입력해 주세요.");
                return;
            }

            // 다중 선택(체크박스) 값 취합
            const checkedBoxes = document.querySelectorAll(`input[name="product-${id}"]:checked`);
            let selectedProducts = [];
            checkedBoxes.forEach(box => {
                const prodId = box.getAttribute('data-id');
                const qtySelect = document.querySelector(`select[name="qty-${id}-${prodId}"]`);
                const qtyText = qtySelect ? ` (${qtySelect.value})` : '';
                selectedProducts.push(box.value + qtyText);
            });
            const product = selectedProducts.length > 0 ? selectedProducts.join(' + ') : "미선택";

            const payload = {
                apartment: apartment,
                phone: phone,
                consultTime: consultTime,
                eventName: `${currentEventName} - [${product}]`
            };

            // 제출 버튼 비활성화 및 텍스트 변경
            const submitBtn = document.getElementById(`btn-submit-${id}`);
            const originalText = submitBtn.innerText;
            submitBtn.innerText = "제출 중... (잠시만 기다려주세요)";
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.7";
            submitBtn.style.cursor = "wait";

            const GOOGLE_WEBAPP_URL = "https://script.google.com/macros/s/AKfycby4sFDQcQ8BWX0jLdKZq86Ob3z537xSaHZ7Xl2ecg1k4kLO9Qw0TtMPG8BgUIiiUfekRQ/exec";
            fetch(GOOGLE_WEBAPP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).then(() => {
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
                submitBtn.style.cursor = "pointer";

                alert(`상담신청이 완료되어 담당자가 곧 연락을 드리겠습니다. 신청해 주셔서 감사합니다.\n\n이벤트명 : ${currentEventName}\n하츠충남대리점`);
                // 신청 성공 후 입력 칸 초기화 및 리셋
                document.getElementById(`apt-${id}`).value = "";
                document.getElementById(`phone-${id}`).value = "";
                document.getElementById(`time-${id}`).value = "";
                // 폼 체크박스 리셋
                checkedBoxes.forEach(box => box.checked = false);
                toggleCampaign(id, currentEventName);
            }).catch(err => {
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
                submitBtn.style.cursor = "pointer";

                alert("접수 중 오류가 발생했습니다. 전단지의 대표 번호로 전화 문의 부탁드립니다.");
                console.error(err);
            });
        }
    </script>
</body>

</html>
