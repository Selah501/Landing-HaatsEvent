<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Insert Test Data</title>
</head>
<body>
    <h3>Inserting Test Data...</h3>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://flyer-event-page-2026-default-rtdb.firebaseio.com",
            projectId: "flyer-event-page-2026"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const today = new Date();
        const offset = today.getTimezoneOffset() * 60000;
        const localDate = new Date(today.getTime() - offset).toISOString().split('T')[0];

        const testRef = ref(db, `reservations/${localDate}/14:00`);
        
        const testData = {
            reservationId: "test_voice_report_001",
            status: "confirmed",
            type: "test",
            customerInfo: {
                name: "AI 음성비서 테스트 고객",
                phone: "010-1234-5678",
                apt: "푸르지오 101동 101호",
                items: ["테스트 환풍기 신청"],
                notes: "테스트를 위해 에이전트가 자동 생성한 데이터입니다."
            }
        };

        set(testRef, testData).then(() => {
            document.body.innerHTML += '<h3 style="color:green;">✅ Test data successfully inserted!</h3><p>You can now open admin_v2.html</p>';
        }).catch(err => {
            document.body.innerHTML += '<h3 style="color:red;">❌ Error: ' + err.message + '</h3>';
        });
    </script>
</body>
</html>
