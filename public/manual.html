<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용자 매뉴얼 & 릴리스 노트</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-light.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background: white; padding: 20px 30px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .header h1 { margin: 0; font-size: 24px; color: #111827; }
        
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        .sidebar { width: 300px; background: white; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; overflow-y: auto; }
        .search-container { padding: 16px; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; background: white; }
        .search-container input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        
        .nav-category { padding: 12px 16px; font-weight: bold; color: #6b7280; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 8px; }
        .nav-item { padding: 10px 16px; cursor: pointer; color: #374151; font-size: 14px; transition: background 0.2s; border-left: 3px solid transparent; }
        .nav-item:hover { background: #f9fafb; }
        .nav-item.active { background: #eff6ff; border-left-color: #3b82f6; color: #1d4ed8; font-weight: 500; }
        
        .content-area { flex: 1; padding: 40px; overflow-y: auto; background: white; }
        .markdown-body { box-sizing: border-box; min-width: 200px; max-width: 900px; margin: 0 auto; }
        .markdown-body img { max-width: 100%; border: 1px solid #e5e7eb; border-radius: 6px; margin: 10px 0; }
        
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #6b7280; }
        .empty-state h2 { color: #374151; }
        
        /* Highlight matched text */
        .highlight { background-color: #fef08a; padding: 0 2px; border-radius: 2px; }
    </style>
</head>
<body>

    <div class="header">
        <div style="display: flex; align-items: center; gap: 16px;">
            <h1>📖 매뉴얼 & 릴리스 노트</h1>
            <span style="color:#6b7280; font-size: 14px;" id="data-status">데이터 로드 중...</span>
        </div>
        <div id="nav-container"></div>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="매뉴얼 검색 (제목 또는 내용)...">
            </div>
            <div id="manual-list">
                <!-- 리스트 렌더링 -->
            </div>
        </div>
        <div class="content-area">
            <div id="content-viewer" class="markdown-body">
                <div class="empty-state">
                    <h2>선택된 문서가 없습니다.</h2>
                    <p>좌측 메뉴에서 문서를 선택하거나 검색해주세요.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="./auth.js"></script>
    <script>
        let manualData = [];

        // 로그인 확인 및 GNB 렌더링
        initAdminAuth(() => {
            document.getElementById('nav-container').innerHTML = renderAdminNav('manual');
            loadManualData();
        });

        async function loadManualData() {
            try {
                // Fetch the JSON generated by sync_manuals.js
                const response = await fetch('./data/manual_data.json?t=' + new Date().getTime());
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                manualData = await response.json();
                
                document.getElementById('data-status').textContent = `총 ${manualData.length}개의 문서가 로드되었습니다.`;
                renderList(manualData);
                
                // Select the first item by default if exists
                if (manualData.length > 0) {
                    // HISTORY_AND_ROADMAP.md를 우선적으로 보여줌
                    const historyDoc = manualData.find(d => d.id === 'HISTORY_AND_ROADMAP');
                    if(historyDoc) selectDocument(historyDoc.id);
                    else selectDocument(manualData[0].id);
                }
            } catch (error) {
                console.error("데이터 로드 실패:", error);
                document.getElementById('data-status').textContent = `데이터 로드 실패: 동기화 스크립트를 실행했는지 확인해주세요.`;
            }
        }

        function renderList(dataToRender) {
            const listContainer = document.getElementById('manual-list');
            listContainer.innerHTML = '';

            // Group by category
            const categories = {};
            dataToRender.forEach(doc => {
                if (!categories[doc.category]) {
                    categories[doc.category] = [];
                }
                categories[doc.category].push(doc);
            });

            for (const [category, docs] of Object.entries(categories)) {
                const catEl = document.createElement('div');
                catEl.className = 'nav-category';
                catEl.textContent = category;
                listContainer.appendChild(catEl);

                docs.forEach(doc => {
                    const itemEl = document.createElement('div');
                    itemEl.className = 'nav-item';
                    itemEl.id = `nav-${doc.id}`;
                    itemEl.textContent = doc.title;
                    itemEl.onclick = () => selectDocument(doc.id);
                    listContainer.appendChild(itemEl);
                });
            }
            
            if (dataToRender.length === 0) {
                listContainer.innerHTML = '<div style="padding: 20px; color: #6b7280; font-size: 14px; text-align: center;">검색 결과가 없습니다.</div>';
            }
        }

        function selectDocument(id) {
            // Update active state
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById(`nav-${id}`);
            if (activeEl) activeEl.classList.add('active');

            const doc = manualData.find(d => d.id === id);
            if (!doc) return;

            const viewer = document.getElementById('content-viewer');
            
            // marked 옵션 설정 (보안 이슈를 위해 sanitize 등 설정 가능하지만 내부용이므로 생략)
            viewer.innerHTML = marked.parse(doc.content);
        }

        // 검색 기능
        document.getElementById('search-input').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase().trim();
            if (!keyword) {
                renderList(manualData);
                return;
            }

            const filtered = manualData.filter(doc => {
                return doc.title.toLowerCase().includes(keyword) || 
                       doc.content.toLowerCase().includes(keyword);
            });
            renderList(filtered);
        });

    </script>
</body>
</html>
