<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카탈로그 PDF 이미지 추출기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-5 rounded shadow-sm max-w-700">
        <h2 class="mb-4 text-primary fw-bold">PDF 카탈로그 이미지 추출기</h2>
        <p class="text-muted">제공해주신 하츠/힘펠 PDF 파일을 선택하시면, 각 페이지를 1단계 상세페이지용 고화질 JPG 이미지로 일괄 변환해 드립니다.</p>
        
        <input type="file" id="pdfInput" class="form-control mb-4" accept="application/pdf">
        <button id="extractBtn" class="btn btn-primary w-100 btn-lg mb-4" disabled>전체 페이지 이미지로 추출하기</button>
        
        <div id="progress" class="mb-4" style="display:none;">
            <p id="statusText">추출 준비 중...</p>
            <div class="progress">
                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
            </div>
        </div>
        
        <div id="result" class="row g-3"></div>
    </div>

    <script>
        const pdfInput = document.getElementById('pdfInput');
        const extractBtn = document.getElementById('extractBtn');
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');
        const progressDiv = document.getElementById('progress');
        const resultDiv = document.getElementById('result');
        
        let pdfDoc = null;

        pdfInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            extractBtn.disabled = false;
            
            const arrayBuffer = await file.arrayBuffer();
            pdfDoc = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
            statusText.innerText = `총 ${pdfDoc.numPages}페이지가 로드되었습니다. 버튼을 누르면 추출을 시작합니다.`;
        });

        extractBtn.addEventListener('click', async () => {
            if (!pdfDoc) return;
            extractBtn.disabled = true;
            progressDiv.style.display = 'block';
            resultDiv.innerHTML = '';
            
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                statusText.innerText = `${pdfDoc.numPages}페이지 중 ${i}페이지 추출 중...`;
                progressBar.style.width = `${(i / pdfDoc.numPages) * 100}%`;
                
                const page = await pdfDoc.getPage(i);
                const viewport = page.getViewport({scale: 2.0}); // 2배율 고화질
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                
                await page.render({canvasContext: ctx, viewport: viewport}).promise;
                
                // 이미지 데이터 생성
                const imgData = canvas.toDataURL('image/jpeg', 0.85);
                
                // 화면에 추가
                const col = document.createElement('div');
                col.className = 'col-md-4 text-center mb-3';
                col.innerHTML = `
                    <div class="card shadow-sm">
                        <img src="${imgData}" class="card-img-top border-bottom" alt="Page ${i}">
                        <div class="card-body p-2">
                            <h6 class="mb-2">${i}페이지</h6>
                            <a href="${imgData}" download="catalog_page_${i}.jpg" class="btn btn-sm btn-outline-secondary w-100">다운로드</a>
                        </div>
                    </div>
                `;
                resultDiv.appendChild(col);
            }
            
            statusText.innerText = "추출 완료! 필요한 이미지를 다운로드하여 /images/catalog/ 폴더에 저장하세요.";
        });
    </script>
</body>
</html>
