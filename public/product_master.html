<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" href="data:,">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 상품 마스터 관리</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --color-pitch-black: #0a0a0a;
            --color-deep-slate: #1c1c1e;
            --color-graphite-base: #2c2c2e;
            --color-interactive-lime: #c9ff00;
            --color-pure-white: #ffffff;
            --color-silver-mist: #8e8e93;
            --color-highlight-gold: #eed37f;
            --color-action-raspberry: #e32652;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--color-pitch-black); color: var(--color-pure-white); margin: 0; padding: 20px; }
        .page-container { max-width: 1400px; margin: 0 auto; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
        .card { background-color: var(--color-graphite-base); border: 1px solid #333; border-radius: 12px; padding: 20px; }
        
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #444; }
        th { background-color: var(--color-deep-slate); color: var(--color-silver-mist); font-weight: 600; position: sticky; top: 0; }
        tr:hover { background-color: #333; }
        
        input[type="text"], input[type="number"], select {
            width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #555; background: var(--color-deep-slate); color: white; box-sizing: border-box;
        }
        button { padding: 8px 16px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; }
        .btn-primary { background-color: #2563eb; color: white; }
        .btn-success { background-color: #10b981; color: white; }
        .btn-danger { background-color: #e32652; color: white; }
        
        /* Toggle Switch */
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--color-interactive-lime); }
        input:checked + .slider:before { transform: translateX(20px); background-color: var(--color-pitch-black); }

        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: var(--color-graphite-base); padding: 24px; border-radius: 12px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; border: 1px solid #444; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; color: var(--color-silver-mist); }
        
        /* Lightbox */
        .global-lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 9999; cursor: pointer; }
        .global-lightbox img { max-width: 90%; max-height: 90vh; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div class="page-container">
    <div id="unified-header"></div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="text" id="searchInput" placeholder="상품명 또는 모델명 검색..." style="width: 300px;" onkeyup="filterTable()">
                <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                    <input type="checkbox" id="activeFilter" onchange="filterTable()" checked>
                    <span>활성 상품만 보기</span>
                </label>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-success" onclick="openProductModal(null)">+ 단품 추가</button>
                <button class="btn-primary" onclick="openSetModal()">+ 세트 조립</button>
            </div>
        </div>

        <div style="overflow-x: auto; max-height: 70vh;">
            <table id="productTable">
                <thead>
                    <tr>
                        <th width="60">취급</th>
                        <th width="60">유형</th>
                        <th width="20%">상품명</th>
                        <th width="15%">모델명</th>
                        <th>제품원가</th>
                        <th>기본설치비</th>
                        <th>옵션/기타</th>
                        <th>합계</th>
                        <th width="100">관리</th>
                    </tr>
                </thead>
                <tbody id="productTbody">
                    <tr><td colspan="9" style="text-align: center;">데이터를 불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 단품/수정 모달 -->
<div id="productModal" class="modal-overlay">
    <div class="modal">
        <h2 id="modalTitle" style="margin-top:0;">상품 수정</h2>
        <input type="hidden" id="modalId">
        <input type="hidden" id="modalIsSet">
        
        <div class="form-group">
            <label>상품명</label>
            <input type="text" id="modalName">
        </div>
        <div class="form-group">
            <label>모델명</label>
            <input type="text" id="modalModel">
        </div>
        <div class="form-group">
            <label>마케팅 메모 (검색 키워드 등)</label>
            <input type="text" id="modalMarketingMemo" placeholder="예: 구형, 단종, 대체품 등">
        </div>
        
        <div style="border: 1px solid #444; border-radius: 6px; padding: 12px; background: rgba(0,0,0,0.2); margin-bottom: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <label style="margin: 0; color: var(--color-interactive-lime);">💰 가격 및 판매가 정보</label>
                <button type="button" onclick="goToCalculator()" style="background:var(--color-interactive-lime); color:#000; border:none; padding:4px 10px; border-radius:4px; cursor:pointer; font-size:12px; font-weight:bold;">이 상품의 판매가 세팅하러 가기 ↗</button>
            </div>
            
            <div style="display: flex; gap: 12px; align-items: center;">
                <div style="flex: 1;">
                    <label style="font-size: 11px; color: #888; margin-bottom: 4px;">제품 원가 (유일한 수정 가능 항목)</label>
                    <input type="number" id="modalPricePurchase" oninput="calculateTotal()" style="padding: 6px; font-size: 13px;">
                </div>
                <div style="flex: 2; display: flex; gap: 12px; padding-left: 12px; border-left: 1px solid #444; color: #ccc; font-size: 12px;">
                    <div><div style="color:#888; font-size:10px; margin-bottom:4px;">기본설치비</div><span id="readPriceInstall">0</span>원</div>
                    <div><div style="color:#888; font-size:10px; margin-bottom:4px;">옵션비용</div><span id="readPriceOptions">0</span>원</div>
                    <div><div style="color:#888; font-size:10px; margin-bottom:4px;">기타(조정)</div><span id="readPriceOther">0</span>원</div>
                    <div><div style="color:#888; font-size:10px; margin-bottom:4px;">총 판매가 합계</div><span id="readPriceTotal" style="color:var(--color-interactive-lime); font-weight:bold; font-size:14px;">0</span>원</div>
                </div>
            </div>

            <div id="priceHistoriesContainer" style="margin-top: 12px; border-top: 1px dashed #444; padding-top: 10px; display: none;">
                <div style="font-size: 11px; color: #888; margin-bottom: 6px;">🕐 저장된 계산기 견적 (최근 4개)</div>
                <div id="priceHistoriesList" style="display: flex; flex-direction: column; gap: 4px; font-size: 12px;"></div>
            </div>
            
            <!-- Hidden inputs for backend saving -->
            <input type="hidden" id="modalPriceInstall">
            <input type="hidden" id="modalPriceOptions">
            <input type="hidden" id="modalPriceOther">
            <input type="hidden" id="modalPriceTotal">
        </div>

        <div class="form-group" id="setComponentsGroup" style="display: none; background: #222; padding: 12px; border-radius: 6px;">
            <label>세트 구성품</label>
            <div id="setComponentsList"></div>
            <select id="setComponentSelect" style="margin-top: 10px;">
                <option value="">구성품 추가...</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>제품 이미지 1 (기본 카탈로그 이미지 URL)</label>
            <div style="display:flex; gap:6px; align-items:center;">
                <input type="text" id="modalUrl1" placeholder="https://..." style="flex:1;">
                <button type="button" onclick="openUrlPreview('modalUrl1')" style="background:#334155; color:#94a3b8; border:none; border-radius:6px; padding:8px 10px; cursor:pointer; font-size:14px; white-space:nowrap;" title="새 탭에서 열기">🔗</button>
            </div>
        </div>
        <div class="form-group">
            <label>제품 이미지 2 (추가 설명 이미지 / HTML 페이지 URL)</label>
            <div style="display:flex; gap:6px; align-items:center;">
                <input type="text" id="modalUrl2" placeholder="https://..." style="flex:1;">
                <button type="button" onclick="openUrlPreview('modalUrl2')" style="background:#334155; color:#94a3b8; border:none; border-radius:6px; padding:8px 10px; cursor:pointer; font-size:14px; white-space:nowrap;" title="새 탭에서 열기">🔗</button>
            </div>
        </div>
        <div class="form-group">
            <label>제품 이미지 3 (시공 사례 등 기타 URL)</label>
            <div style="display:flex; gap:6px; align-items:center;">
                <input type="text" id="modalUrl3" placeholder="https://..." style="flex:1;">
                <button type="button" onclick="openUrlPreview('modalUrl3')" style="background:#334155; color:#94a3b8; border:none; border-radius:6px; padding:8px 10px; cursor:pointer; font-size:14px; white-space:nowrap;" title="새 탭에서 열기">🔗</button>
            </div>
        </div>

        <div class="form-group" style="border: 1px dashed #555; padding: 12px; border-radius: 8px; background: rgba(0,0,0,0.2);">
            <label style="color: var(--color-interactive-lime);">🤖 AI 상세페이지 (HTML 버전 보관함)</label>
            <div id="aiDetailPagesList" style="margin-bottom: 8px; font-size: 13px; color: #aaa; display: flex; flex-direction: column; gap: 8px;">
                데이터를 불러오는 중...
            </div>
            <div style="margin-top: 10px; font-size: 12px; color: #888;">
                💡 <b>힌트:</b> 새로운 상세페이지 생성이 필요하시면 안티그래비티 채팅창에 <b>"상세페이지 만들어줘"</b>라고 입력하세요!
            </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
            <button onclick="closeModal()" style="background: #555; color: white;">취소</button>
            <button class="btn-success" onclick="saveProduct()">저장</button>
        </div>
    </div>
</div>

<!-- 글로벌 라이트박스 -->
<div id="globalLightbox" class="global-lightbox" onclick="this.style.display='none'">
    <img id="globalLightboxImg" src="" alt="확대 이미지">
</div>

<script src="auth.js"></script>
<script>
    const SUPABASE_URL = 'https://belchthacupzpgxevecx.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_weMvIv-69PgtXwzGlgweLg_NEJfOACN';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let allProducts = [];

    // 로그인 검증 및 GNB 렌더링
    initAdminAuth(() => {
        document.getElementById('unified-header').innerHTML = renderUnifiedHeader('product_master', '📦 상품 마스터');
        loadProducts();
    });

    async function loadProducts() {
        const { data, error } = await sb.from('products').select('*').order('name');
        if (error) {
            alert("상품 데이터를 불러오는데 실패했습니다.");
            return;
        }
        allProducts = data;

        const urlParams = new URLSearchParams(window.location.search);
        const searchParam = urlParams.get('search');
        if (searchParam) {
            document.getElementById('searchInput').value = searchParam;
        }

        const applyProductId = urlParams.get('apply_product_id');
        if (applyProductId) {
            setTimeout(() => {
                const targetProd = allProducts.find(p => String(p.id) === String(applyProductId));
                if (targetProd) {
                    openProductModal(targetProd);
                    document.getElementById('modalPricePurchase').value = urlParams.get('cost') || 0;
                    
                    const inst = parseInt(urlParams.get('install') || 0);
                    const opt = parseInt(urlParams.get('options') || 0);
                    const other = parseInt(urlParams.get('other') || 0);
                    
                    document.getElementById('modalPriceInstall').value = inst;
                    document.getElementById('modalPriceOptions').value = opt;
                    document.getElementById('modalPriceOther').value = other;
                    
                    if (document.getElementById('readPriceInstall')) document.getElementById('readPriceInstall').textContent = inst.toLocaleString();
                    if (document.getElementById('readPriceOptions')) document.getElementById('readPriceOptions').textContent = opt.toLocaleString();
                    if (document.getElementById('readPriceOther')) document.getElementById('readPriceOther').textContent = other.toLocaleString();

                    calculateTotal();
                }
            }, 500);
        }
        
        // Ensure default properties
        allProducts.forEach(p => {
            if(!p.prices) p.prices = { purchase:0, sell_product:0, sell_install:0, sell_total:0 };
            if(p.is_active === null) p.is_active = false;
            if(p.is_set === null) p.is_set = false;
            if(!p.set_components) p.set_components = [];
            if(!p.detail_urls) p.detail_urls = [];
            if(!p.detail_pages) p.detail_pages = [];
        });

        renderTable();
        populateSetDropdown();
    }

    function renderTable() {
        const tbody = document.getElementById('productTbody');
        tbody.innerHTML = '';
        
        const searchWord = document.getElementById('searchInput').value.toLowerCase();
        const showOnlyActive = document.getElementById('activeFilter').checked;

        const filtered = allProducts.filter(p => {
            if (showOnlyActive && !p.is_active) return false;
            if (searchWord) {
                const name = (p.name || '').toLowerCase();
                const model = (p.model || '').toLowerCase();
                const memo = (p.marketing_memo || '').toLowerCase();
                if (!name.includes(searchWord) && !model.includes(searchWord) && !memo.includes(searchWord)) return false;
            }
            return true;
        });

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" style="text-align: center;">조건에 맞는 상품이 없습니다.</td></tr>';
            return;
        }

        filtered.forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <label class="switch">
                        <input type="checkbox" ${p.is_active ? 'checked' : ''} onchange="toggleActive('${p.id}', this.checked)">
                        <span class="slider"></span>
                    </label>
                </td>
                <td>
                    ${p.is_set ? '<span style="color:#f59e0b; font-weight:bold; font-size:12px;">세트</span>' : '<span style="color:#8e8e93; font-size:12px;">단품</span>'}
                </td>
                <td>${p.name || ''}</td>
                <td>
                    ${p.detail_urls && p.detail_urls.length > 0 && p.detail_urls[0] ? 
                        `<span style="color:var(--color-interactive-lime); cursor:pointer; text-decoration:underline;" onclick="openLightbox('${p.detail_urls[0]}')">${p.model || '이미지보기'}</span>` 
                        : (p.model || '')}
                </td>
                <td>${(p.prices?.purchase || 0).toLocaleString()}원</td>
                <td>${(p.prices?.sell_install || 0).toLocaleString()}원</td>
                <td>${((p.prices?.options || 0) + (p.prices?.other || 0)).toLocaleString()}원</td>
                <td style="color:var(--color-interactive-lime); font-weight:bold;">${(p.prices?.sell_total || 0).toLocaleString()}원</td>
                <td>
                    <button class="btn-primary" style="padding:4px 8px; font-size:12px;" onclick='openProductModal(${JSON.stringify(p).replace(/'/g, "&#39;")})'>상세/수정</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function filterTable() {
        renderTable();
    }

    async function toggleActive(id, isActive) {
        const p = allProducts.find(x => x.id == id);
        if(p) p.is_active = isActive;
        const { error } = await sb.from('products').update({ is_active: isActive }).eq('id', id);
        if(error) {
            alert('업데이트 실패: ' + error.message);
            if(p) p.is_active = !isActive;
            renderTable();
        }
    }

    function openLightbox(url) {
        if (!url) return;
        document.getElementById('globalLightboxImg').src = url;
        document.getElementById('globalLightbox').style.display = 'flex';
    }

    function openUrlPreview(inputId) {
        const url = document.getElementById(inputId).value.trim();
        if(url) {
            window.open(url, '_blank');
        } else {
            alert('URL이 비어있습니다.');
        }
    }

    function previewAiVersion(versionId) {
        if (!currentEditProductId) return;
        window.open('./product.html?id=' + currentEditProductId + '&version=' + versionId, '_blank');
    }

    async function deleteAiVersion(versionId) {
        if (!confirm('이 버전을 정말 삭제하시겠습니까? (복구 불가)')) return;
        
        const prod = allProducts.find(p => p.id === currentEditProductId);
        if(!prod || !prod.detail_pages) return;

        const newPages = prod.detail_pages.filter(dp => dp.id !== versionId);
        
        const { error } = await sb.from('products').update({ detail_pages: newPages }).eq('id', currentEditProductId);
        if (error) {
            alert('삭제 실패: ' + error.message);
        } else {
            prod.detail_pages = newPages;
            renderAiPagesList(prod);
            alert('삭제되었습니다.');
        }
    }

    function renderAiPagesList(prod) {
        const aiListEl = document.getElementById('aiDetailPagesList');
        if (prod && prod.detail_pages && prod.detail_pages.length > 0) {
            let html = '';
            prod.detail_pages.forEach(dp => {
                html += `
                <div style="display: flex; justify-content: space-between; align-items: center; background: #2c2c2e; padding: 8px 12px; border-radius: 6px;">
                    <span style="color: #fff;">📄 ${dp.title || '이름 없음'}</span>
                    <div style="display: flex; gap: 6px;">
                        <button type="button" onclick="previewAiVersion('${dp.id}')" style="background:#3b82f6; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:12px;">미리보기</button>
                        <button type="button" onclick="deleteAiVersion('${dp.id}')" style="background:#ef4444; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:12px;">삭제</button>
                    </div>
                </div>`;
            });
            aiListEl.innerHTML = html;
        } else {
            aiListEl.innerHTML = '<div style="padding: 10px 0;">보관된 AI 상세페이지가 없습니다.</div>';
        }
    }

    function goToCalculator() {
        if (!currentEditProductId) {
            alert('새로운 상품은 먼저 저장한 뒤 계산기로 이동할 수 있습니다.');
            return;
        }
        window.open('price_calculator.html?product_id=' + currentEditProductId, '_blank');
    }

    function renderPriceHistories(prod) {
        const container = document.getElementById('priceHistoriesContainer');
        const listEl = document.getElementById('priceHistoriesList');
        
        if (!prod || !prod.details || !prod.details.price_histories || prod.details.price_histories.length === 0) {
            container.style.display = 'none';
            return;
        }
        
        container.style.display = 'block';
        let htmlStr = '';
        prod.details.price_histories.forEach(h => {
            htmlStr += `
            <div style="display:flex; justify-content:space-between; align-items:center; background:#2c2c2e; padding:6px 10px; border-radius:4px;">
                <div>
                    <span style="color:#fff; font-weight:bold; margin-right:8px;">${h.name}</span>
                    <span style="color:#888;">${h.date}</span>
                </div>
                <div style="color:var(--color-interactive-lime); font-weight:bold;">
                    ${h.price.toLocaleString()}원
                </div>
            </div>`;
        });
        listEl.innerHTML = htmlStr;
    }

    /* Modal Logic */
    function openProductModal(prod) {
        currentEditProductId = prod ? prod.id : null;
        document.getElementById('modalTitle').textContent = prod ? '상품 수정' : '단품 추가';
        document.getElementById('modalId').value = prod ? prod.id : '';
        document.getElementById('modalIsSet').value = prod ? prod.is_set : 'false';
        
        document.getElementById('modalName').value = prod ? (prod.name || '') : '';
        document.getElementById('modalModel').value = prod ? (prod.model || '') : '';
        document.getElementById('modalMarketingMemo').value = prod ? (prod.marketing_memo || '') : '';
        
        document.getElementById('modalPricePurchase').value = prod ? (prod.prices?.purchase || 0) : 0;
        document.getElementById('modalPriceInstall').value = prod ? (prod.prices?.sell_install || 0) : 0;
        document.getElementById('modalPriceOptions').value = prod ? (prod.prices?.options || 0) : 0;
        document.getElementById('modalPriceOther').value = prod ? (prod.prices?.other || 0) : 0;
        document.getElementById('modalPriceTotal').value = prod ? (prod.prices?.sell_total || 0) : 0;
        
        document.getElementById('readPriceInstall').textContent = (prod ? (prod.prices?.sell_install || 0) : 0).toLocaleString();
        document.getElementById('readPriceOptions').textContent = (prod ? (prod.prices?.options || 0) : 0).toLocaleString();
        document.getElementById('readPriceOther').textContent = (prod ? (prod.prices?.other || 0) : 0).toLocaleString();
        document.getElementById('readPriceTotal').textContent = (prod ? (prod.prices?.sell_total || 0) : 0).toLocaleString();
        
        renderPriceHistories(prod);
        
        const urls = prod ? (prod.detail_urls || []) : [];
        document.getElementById('modalUrl1').value = urls[0] || '';
        document.getElementById('modalUrl2').value = urls[1] || '';
        document.getElementById('modalUrl3').value = urls[2] || '';

        // AI 상세페이지 리스트 렌더링
        renderAiPagesList(prod);

        // 세트 구성품 UI 제어
        const setGroup = document.getElementById('setComponentsGroup');
        if (prod && prod.is_set) {
            setGroup.style.display = 'block';
            document.getElementById('modalPricePurchase').readOnly = true;
            renderSetComponents(prod.set_components || []);
        } else {
            setGroup.style.display = 'none';
            document.getElementById('modalPricePurchase').readOnly = false;
        }

        document.getElementById('productModal').style.display = 'flex';
    }

    function openSetModal() {
        openProductModal(null);
        document.getElementById('modalTitle').textContent = '세트 상품 추가';
        document.getElementById('modalIsSet').value = 'true';
        document.getElementById('setComponentsGroup').style.display = 'block';
        document.getElementById('modalPricePurchase').readOnly = true;
        renderSetComponents([]);
    }

    function closeModal() {
        document.getElementById('productModal').style.display = 'none';
    }

    function calculateTotal() {
        const purchase = parseInt(document.getElementById('modalPricePurchase').value) || 0;
        const inst = parseInt(document.getElementById('modalPriceInstall').value) || 0;
        const opt = parseInt(document.getElementById('modalPriceOptions').value) || 0;
        const other = parseInt(document.getElementById('modalPriceOther').value) || 0;
        const total = purchase + inst + opt + other;
        document.getElementById('modalPriceTotal').value = total;
        // In the new UI, purchase cost doesn't automatically recalculate the read-only total
        // But if we want to keep it consistent:
        document.getElementById('readPriceTotal').textContent = total.toLocaleString();
    }

    async function saveProduct() {
        const id = document.getElementById('modalId').value;
        const isSet = document.getElementById('modalIsSet').value === 'true';
        
        const payload = {
            name: document.getElementById('modalName').value,
            model: document.getElementById('modalModel').value,
            marketing_memo: document.getElementById('modalMarketingMemo').value.trim(),
            is_active: true,
            is_set: isSet,
            prices: {
                purchase: parseInt(document.getElementById('modalPricePurchase').value) || 0,
                sell_install: parseInt(document.getElementById('modalPriceInstall').value) || 0,
                options: parseInt(document.getElementById('modalPriceOptions').value) || 0,
                other: parseInt(document.getElementById('modalPriceOther').value) || 0,
                sell_total: parseInt(document.getElementById('modalPriceTotal').value) || 0
            },
            detail_urls: [
                document.getElementById('modalUrl1').value.trim(),
                document.getElementById('modalUrl2').value.trim(),
                document.getElementById('modalUrl3').value.trim()
            ]
        };

        if (isSet) {
            payload.set_components = currentSetComponents;
        }

        if (id) {
            const { error } = await sb.from('products').update(payload).eq('id', id);
            if(error) return alert("저장 실패: " + error.message);
        } else {
            // 신규 추가: Supabase id 컬럼에 기본값 없으므로 클라이언트에서 UUID 생성
            payload.id = crypto.randomUUID();
            const { error } = await sb.from('products').insert([payload]);
            if(error) return alert("추가 실패: " + error.message);
        }

        closeModal();
        loadProducts();
    }

    /* Set Components Logic */
    let currentSetComponents = [];
    
    function populateSetDropdown() {
        const sel = document.getElementById('setComponentSelect');
        sel.innerHTML = '<option value="">구성품 추가...</option>';
        allProducts.filter(p => !p.is_set).forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.textContent = `${p.name} (${p.model})`;
            sel.appendChild(opt);
        });
        
        sel.onchange = (e) => {
            if(!e.target.value) return;
            currentSetComponents.push(e.target.value);
            renderSetComponents(currentSetComponents);
            e.target.value = '';
        };
    }

    function renderSetComponents(compIds) {
        currentSetComponents = compIds;
        const container = document.getElementById('setComponentsList');
        container.innerHTML = '';
        let totalPurchase = 0;

        compIds.forEach((cId, idx) => {
            const p = allProducts.find(x => x.id == cId);
            if(p) {
                totalPurchase += (p.prices?.purchase || 0);
                const div = document.createElement('div');
                div.style.cssText = "display:flex; justify-content:space-between; background:#333; padding:6px; margin-bottom:4px; border-radius:4px;";
                div.innerHTML = `
                    <span>${p.name} (${p.model}) - ${(p.prices?.purchase || 0).toLocaleString()}원</span>
                    <button style="background:none; border:none; color:#e32652; cursor:pointer;" onclick="removeComponent(${idx})">❌</button>
                `;
                container.appendChild(div);
            }
        });

        document.getElementById('modalPricePurchase').value = totalPurchase;
        calculateTotal();
    }

    function removeComponent(idx) {
        currentSetComponents.splice(idx, 1);
        renderSetComponents(currentSetComponents);
    }
</script>
</body>
</html>
