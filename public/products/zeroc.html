<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>힘펠 제로크 HV3-80X - 하츠 충남대리점</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="mobile-container" style="min-height: 100vh; display: flex; flex-direction: column;">
        <nav class="sticky-nav">
            <div class="nav-logo"><span>[공식]</span>하츠 충남대리점</div>
            <a href="tel:010-2886-5086" class="btn btn-secondary">전화 문의</a>
        </nav>

        <div class="container" style="padding: 24px; flex: 1;">
            <div style="font-size: 14px; color: var(--color-interactive-lime); font-weight: bold; margin-bottom: 8px;">프리미엄 환기가전 특가</div>
            <h1 style="color: var(--color-pure-white); font-size: 24px; line-height: 1.3; margin: 0 0 24px 0;">
                힘펠 제로크 HV3-80X(MD-N)
            </h1>

            <div style="background-color: var(--color-graphite-base); border-radius: 8px; padding: 20px; margin-bottom: 24px; border: 1px solid #333;">
                <h2 style="color: var(--color-pure-white); margin-top: 0; margin-bottom: 16px; font-size: 20px;">강력한 제로크 환기 & 역류방지 전동댐퍼</h2>
                
                <img src="../images/zeroc-2.png" alt="힘펠 제로크 특장점" style="width: 100%; border-radius: 8px; margin-bottom: 24px; background-color: white;">
                
                <div style="font-size: 15px; font-weight: bold; color: white; margin-bottom: 12px; border-bottom: 1px solid #444; padding-bottom: 4px;">제품 사양 및 치수</div>
                <img src="../images/zeroc-1.png" alt="힘펠 제로크 사양" style="width: 100%; border-radius: 8px; background-color: white;">
            </div>
            
            <div style="padding-bottom: 40px;"></div>
        </div>

        <div class="bottom-fixed-buttons" style="position: sticky; bottom: 0; background-color: var(--color-graphite-base); padding: 16px 24px; border-top: 1px solid #1c1c1e; display: flex; flex-direction: column; gap: 12px; z-index: 100;">
            <a href="../index.html" class="btn btn-ghost">
                ← 이벤트 메인 화면으로 돌아가기
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const phone = params.get('phone');
            if (phone) {
                const phoneLinks = document.querySelectorAll('a[href^="tel:"]');
                phoneLinks.forEach(link => {
                    link.href = 'tel:' + phone;
                });
            }
        });
    </script>
</body>
</html>
