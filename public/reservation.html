<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설치 예약 바로하기</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <style>
        .form-container { background-color: var(--color-graphite-base); padding: 24px; border-radius: 8px; border: 1px solid #333; margin-top: 24px; }
        .form-title { font-size: 20px; color: var(--color-pure-white); margin-bottom: 20px; font-weight: bold; border-bottom: 1px solid #444; padding-bottom: 12px; }
        
        .checkbox-label {
            display: flex; align-items: center; color: var(--color-silver-mist); margin-bottom: 12px;
            font-size: 15px; cursor: pointer; padding: 12px; background-color: #2a2a2d;
            border-radius: 8px; border: 1px solid #444; transition: all 0.2s ease;
        }
        .checkbox-label:hover { background-color: #333; }
        .checkbox-label input[type="checkbox"] { transform: scale(1.3); margin-right: 12px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="mobile-container" style="min-height: 100vh; display: flex; flex-direction: column;">
        <nav class="sticky-nav">
            <div class="nav-logo"><span>[공식]</span>하츠 충남대리점</div>
            <a href="tel:010-2886-5086" class="btn btn-secondary">전화 문의</a>
        </nav>

        <div class="container" style="padding: 24px; flex: 1;">
            <div id="event-title-display" style="font-size: 16px; color: var(--color-interactive-lime); font-weight: bold; margin-bottom: 8px;"></div>
            <h1 style="color: var(--color-pure-white); font-size: 24px; margin: 0 0 8px 0;">설치 예약 신청서</h1>
            <p style="color: var(--color-silver-mist); font-size: 14px; margin-bottom: 24px;">작성해주시면 담당자가 확인 후 연락드립니다.</p>

            <div class="form-container">
                <div style="margin-bottom: 20px;">
                    <div style="color: var(--color-pure-white); font-size: 15px; font-weight: bold; margin-bottom: 12px;">설치 희망 상품 (다중 선택 가능)</div>
                    <div id="products-container">
                        <!-- JS로 렌더링 -->
                    </div>
                </div>

                <div class="form-fields-container" style="margin-bottom: 24px;">
                    <!-- 아파트 동/호수 입력 -->
                    <div class="form-field-item">
                        <div class="form-field-header">
                            <label class="form-field-label" for="apt-input">🏢 아파트 동·호수</label>
                            <span class="form-field-badge">✎ 입력하기</span>
                        </div>
                        <div class="form-field-input-box">
                            <input type="text" id="apt-input" placeholder="예: 101동 102호">
                        </div>
                        <div class="form-field-hint">💡 동과 호수를 이어서 적어주세요 (예: 101동 102호).</div>
                    </div>

                    <!-- 휴대폰 번호 입력 -->
                    <div class="form-field-item">
                        <div class="form-field-header">
                            <label class="form-field-label" for="phone-input">📱 휴대폰 번호</label>
                            <span class="form-field-badge">✎ 입력하기</span>
                        </div>
                        <div class="form-field-input-box">
                            <input type="text" id="phone-input" value="010-" placeholder="예: 010-1234-5678">
                        </div>
                        <div class="form-field-hint">💡 연락 받으실 휴대폰 번호를 이어서 적어주세요.</div>
                    </div>
                    
                    <div class="form-field-item" style="margin-bottom: 0;">
                        <div class="form-field-header">
                            <label class="form-field-label" for="date-input">📅 시공 희망일 (선택)</label>
                        </div>
                        <div style="position: relative; margin-top: 4px;">
                            <input type="date" id="date-input" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background-color: #222; color: white; font-size: 15px; box-sizing: border-box;" onchange="updateDateDisplay()">
                            <div id="date-display" style="position: absolute; right: 14px; top: 12px; color: var(--color-interactive-lime); font-weight: bold; pointer-events: none;"></div>
                        </div>
                    </div>
                </div>

                <button id="btn-submit" class="btn btn-primary" style="margin-top: 24px; width: 100%;" onclick="submitReservation()">설치 예약 접수하기</button>
            </div>
            
            <a href="./index.html" class="btn btn-ghost" style="margin-top: 24px; display: block; text-align: center;">← 메인 화면으로 돌아가기</a>
        </div>
    </div>

    <!-- Firebase SDK (모듈식) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://flyer-event-page-2026-default-rtdb.firebaseio.com",
            projectId: "flyer-event-page-2026"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Firebase에서 실시간 데이터 불러오기
        const dbRef = ref(db, '/');
        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                window.globalProducts = data.products || [];
                window.eventsData = data.events || [];
                if (typeof window.initReservation === 'function') {
                    window.initReservation();
                }
            }
        });
    </script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('eventId');
        let currentEvent = null;

        // 상품 표시 텍스트 조립 함수
        window.getProductText = function(prodObj) {
            const masterProd = window.globalProducts ? window.globalProducts.find(p => p.id === prodObj.id) : null;
            const prodName = masterProd ? masterProd.name : "알 수 없는 상품";
            const priceText = prodObj.customText ? prodObj.customText : (masterProd ? masterProd.defaultPriceText : "");
            return priceText ? `${prodName} (${priceText})` : prodName;
        }

        window.initReservation = function() {
            if (eventId && window.eventsData) {
                currentEvent = window.eventsData.find(ev => ev.id === eventId);
            }

            if (currentEvent) {
                document.getElementById('event-title-display').innerText = currentEvent.title;
                
                // 아파트 디폴트 값 설정 (지역명 및 이벤트/행사 키워드 제거하여 아파트명만 추출)
                const aptInput = document.getElementById('apt-input');
                if (aptInput) {
                    let defaultApt = currentEvent.aptName;
                    if (!defaultApt) {
                        defaultApt = currentEvent.title.replace(/(아파트|주방후드|환풍기|전동댐퍼|인덕션|수전|싱크볼|씽크볼|특가|이벤트|공동구매|교체|설치|핫써머|핫썸머|썸머|써머|여름|스멜|행사|할인|초특가|사전예약|모집|프로모션|패키지|혜택|지원|사은품|202\d).*$/i, '').trim();
                        const words = defaultApt.split(/\s+/);
                        if (words.length >= 2) {
                            defaultApt = words.slice(1).join(' ');
                        }
                        if (!defaultApt) {
                            const origWords = currentEvent.title.split(/\s+/);
                            defaultApt = origWords.length >= 2 ? origWords[1] : origWords[0];
                        }
                    }
                    aptInput.value = defaultApt + " ";
                    aptInput.setAttribute('data-default', defaultApt + " ");
                }
                
                const productsContainer = document.getElementById('products-container');
                const allProducts = [...(currentEvent.mainProducts || []), ...(currentEvent.addonProducts || [])];
                
                let html = '';
                allProducts.forEach((prod, idx) => {
                    const text = window.getProductText(prod);
                    const isFan = text.includes('환풍기') || text.includes('티오람') || text.includes('댐퍼') || text.includes('제로크');
                    let qtyHtml = '';
                    if (isFan) {
                        qtyHtml = `
                            <select name="qty-${prod.id}" style="margin-left: auto; padding: 4px 8px; border-radius: 4px; border: 1px solid #555; background-color: #222; color: white; font-size: 14px;">
                                <option value="1대">1대</option>
                                <option value="2대">2대</option>
                            </select>
                        `;
                    }

                    html += `
                        <label class="checkbox-label" style="display: flex; align-items: center;">
                            <input type="checkbox" name="install-product" value="${text}" data-id="${prod.id}"> 
                            <span style="font-weight: 500; color: #fff;">${text}</span>
                            ${qtyHtml}
                        </label>
                    `;
                });
                productsContainer.innerHTML = html;
            } else {
                alert("잘못된 접근입니다. 메인 페이지로 이동합니다.");
                window.location.href = "./index.html";
            }
        }

        function updateDateDisplay() {
            const dateInput = document.getElementById('date-input').value;
            if (dateInput) {
                const dateObj = new Date(dateInput);
                const days = ['일', '월', '화', '수', '목', '금', '토'];
                const dayName = days[dateObj.getDay()];
                document.getElementById('date-display').innerText = `(${dayName})`;
            } else {
                document.getElementById('date-display').innerText = '';
            }
        }

        function submitReservation() {
            const apartment = document.getElementById('apt-input').value;
            let phone = document.getElementById('phone-input').value;
            const dateInput = document.getElementById('date-input').value;

            phone = phone.replace(/[^0-9]/g, '');
            if (phone.length === 11) {
                phone = phone.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
            } else if (phone.length === 10) {
                phone = phone.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
            }

            if (!apartment || !phone || !dateInput) {
                alert("동/호수, 연락처, 설치 희망일을 모두 입력해 주세요.");
                return;
            }

            const dateObj = new Date(dateInput);
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const dayName = days[dateObj.getDay()];
            const consultTime = `${dateInput} (${dayName})`;

            const checkedBoxes = document.querySelectorAll('input[name="install-product"]:checked');
            let selectedProducts = [];
            checkedBoxes.forEach(box => {
                const prodId = box.getAttribute('data-id');
                const qtySelect = document.querySelector(`select[name="qty-${prodId}"]`);
                const qtyText = qtySelect ? ` (${qtySelect.value})` : '';
                selectedProducts.push(box.value + qtyText);
            });
            const product = selectedProducts.length > 0 ? selectedProducts.join(' + ') : "미선택";

            const payload = {
                apartment: apartment,
                phone: phone,
                consultTime: consultTime,
                eventName: `[설치예약] ${currentEvent.title} - [${product}]`
            };

            const submitBtn = document.getElementById('btn-submit');
            const originalText = submitBtn.innerText;
            submitBtn.innerText = "접수 중... (잠시만 기다려주세요)";
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.7";

            const GOOGLE_WEBAPP_URL = "https://script.google.com/macros/s/AKfycby4sFDQcQ8BWX0jLdKZq86Ob3z537xSaHZ7Xl2ecg1k4kLO9Qw0TtMPG8BgUIiiUfekRQ/exec";
            fetch(GOOGLE_WEBAPP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).then(() => {
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";

                alert(`설치 예약이 완료되어 담당자가 곧 연락을 드리겠습니다. 감사합니다.\n\n이벤트명 : ${currentEvent.title}`);
                window.location.href = "./index.html";
            }).catch(err => {
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";

                alert("접수 중 오류가 발생했습니다. 대표 번호로 전화 문의 부탁드립니다.");
                console.error(err);
            });
        }
    </script>
</body>
</html>
